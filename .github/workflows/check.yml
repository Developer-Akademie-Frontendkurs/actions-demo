name: Mein erster Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --check sum.js
      - run: node --check test/sum.test.js

  test:
    needs: syntax-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
      - run: node --test